name: Scrape OnlineJobs.ph

on:
  schedule:
    # Runs every 6 hours. Edit this line to change frequency.
    # Format: minute hour day month day-of-week (UTC time)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}  # lets you also trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape.py

      - name: Commit results back to repo
        run: |
          git config --global user.name "job-scraper-bot"
          git config --global user.email "actions@github.com"
          git add data/jobs_latest.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "Update job listings $(date -u +'%Y-%m-%d %H:%M')"
          git push
